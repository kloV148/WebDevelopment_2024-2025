<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта изображений</title>
    <style>
        body {
            text-align: center;
            background-color: #f0f0f5;
            font-family: Arial, sans-serif;
        }
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

<h1>Карта изображений</h1>

<img src="/static/img.jpg" usemap="#image-map" alt="Карта изображений">

<map name="image-map">
    <area shape="rect" coords="0,500,360,700" href="https://ru.wikipedia.org/wiki/%D0%9E%D1%80%D0%B0%D0%BD%D0%B3%D1%83%D1%82%D0%B0%D0%BD%D1%8B#/media/%D0%A4%D0%B0%D0%B9%D0%BB:Orang_Utan,_Semenggok_Forest_Reserve,_Sarawak,_Borneo,_Malaysia.JPG" alt="Ссылка">
    <area shape="circle" coords="550,500,50" onclick="changeColor(event)" alt="Изменение цвета">
    <area shape="rect" coords="0,0,320,200" href="/transition/" alt="Переход">
    <area shape="circle" coords="320,280,43" onclick="alert('Глаз.')" alt="Оповещение">
</map>

<script>
    function changeColor(event) {
        event.preventDefault();
        document.body.style.backgroundColor = '#' + Math.floor(Math.random() * 16777215).toString(16);
    }
    function showMessage() {
        alert("Вы нажали на многоугольную область!");
    }
</script>

</body>
</html>
